    return sheetWrap("開一張罰單",
      '<div class="seg" role="group" aria-label="對象"><button type="button" aria-pressed="' + (f.mode === "other") + '" data-act="f-mode" data-v="other">罰' + opn + '</button><button type="button" aria-pressed="' + (f.mode === "self") + '" data-act="f-mode" data-v="self">我自首</button></div>' +
      '<div class="lab"><span class="lab-t">違反哪一條？</span><div class="chips" role="group" aria-label="規則">' +
        act.map(function (r) { return '<button type="button" class="chip" aria-pressed="' + (f.ruleId === r.id) + '" data-act="f-rule" data-id="' + esc(r.id) + '">' + esc(r.title) + ' ' + money(r.amount) + '</button>'; }).join('') +
        '<button type="button" class="chip temp" aria-pressed="' + (f.ruleId === "__temp__") + '" data-act="f-rule" data-id="__temp__">臨時罰單</button>' +
        '<button type="button" class="chip add" data-act="sheet" data-sheet="rule">＋ 提議新規則</button></div>' +
        (act.length || f.ruleId === "__temp__" ? '' : '<p class="note">還沒有生效的規則。可以先開臨時罰單，或者提議新規則。</p>') + '</div>' +
      (f.ruleId === "__temp__" ? '<label class="lab">罰單原因<input id="f-ttitle" class="field" maxlength="40" data-bind="ttitle" value="' + esc(f.ttitle || "") + '" placeholder="例如：說好不生氣結果生氣了"></label>' : '') +
      amountBox("f-amount", "amount", f.amount || 0, "f-amt") +
      '<label class="lab">事發經過（可不填）<textarea id="f-note" class="field" rows="2" maxlength="200" data-bind="note" placeholder="例如：約了七點，七點半才到">' + esc(f.note || "") + '</textarea></label>' +
      '<div class="lab"><span class="lab-t">存進哪個基金？</span><div class="seg ink" role="group" aria-label="基金"><button type="button" aria-pressed="' + (f.fund === "wedding") + '" data-act="f-fund" data-v="wedding">' + esc(S.goals.wedding.name) + '</button><button type="button" aria-pressed="' + (f.fund === "travel") + '" data-act="f-fund" data-v="travel">' + esc(S.goals.travel.name) + '</button></div></div>' +
      (f.mode === "other" && f.ruleId === "__temp__" ? '<p class="note">臨時罰單一定要' + opn + '確認才入帳。對方只可以認罰或申訴，不能使用賴貓卡。</p>'
        : f.mode === "other" ? '<label class="swrow" for="f-confirm"><span><span>要' + opn + '確認才入帳</span><span class="note">對方可以認罰、用賴貓卡或申訴</span></span><input id="f-confirm" class="sw" type="checkbox" role="switch" data-bind-check="confirm"' + (f.confirm ? ' checked' : '') + '></label>'
        : '<p class="note" style="color:var(--ink);font-size:14px">自首會直接存進基金。' + opn + '覺得不用罰的話，可以否決。</p>') +
      '<button type="button" class="btn primary" data-act="submit-ticket"' + busyAttr(ticketReady(f)) + '>' + (f.mode === "self" ? '我自首' : '送出罰單') + '</button>');
  }

  /* 罰單紙 */
  function stubLine(t) {
    var me = S.me, fund = fundName(t.fund);
    if (t.status === "pending") return t.to === me ? "在下面選一個：認罰、用賴貓卡，或申訴。" : "等" + nm(t.to) + "回應。";
    if (t.status === "appeal") return t.from === me ? nm(t.to) + " 提出了申訴，由你裁決。" : "已提出申訴，等" + nm(t.from) + "裁決。";
    if (t.status === "waived") return t.card ? "用了賴貓卡，這張免罰。" : "申訴成功，這張免罰。";
    if (t.status === "vetoed") return nm(other(t.to)) + " 否決了這次自首，不入帳。";
    if (t.voidBy) return nm(t.voidBy) + " 申請刪除這張罰單，等" + nm(other(t.voidBy)) + "同意。";
    if (t.self) return "自首，已存進" + fund + "。";
    if (t.appeal) return "申訴被駁回，罰雙倍，已存進" + fund + "。";
    return "已存進" + fund + "。";
  }
  function tkNo(t) { return t.ruleId ? 'No.' + esc(String(t.id).toUpperCase().slice(0, 6)) : '臨時罰單'; }
  function tkPaper(t, f, short) {
    var me = S.me, amt = paid(t) ? t.final : t.amount;
    var head = '<div class="tk-h"><b>罰單</b><span>' + tkNo(t) + '</span></div>';
    var mark = f.mark ? '<span class="mark ' + f.mark[1] + '" role="status">' + esc(f.mark[0]) + '</span>' : '';
    if (short) return '<div class="tk short">' + head + '<div class="tk-b"><div class="tk-main"><div><span class="tk-title">' + esc(t.title) + '</span></div><span class="tk-amt" style="font-size:32px;line-height:36px">' + money(amt) + '</span></div>' +
      '<span class="tk-k" style="font-size:13px">' + esc(you(t.from)) + ' ' + md(t.ts) + ' 開給' + esc(t.to === me ? '你' : nm(t.to)) + '</span>' + mark + '</div></div>';
    return '<div class="tk">' + head + '<div class="tk-b"><div class="tk-main"><div><span class="tk-k">' + (t.ruleId ? '違反' : '原因') + '</span><span class="tk-title">' + esc(t.title) + '</span></div><span class="tk-amt">' + money(amt) + '</span></div>' +
      '<div class="tk-grid"><div><span class="tk-k">' + (t.self ? '自首' : '開單人') + '</span>' + esc(you(t.self ? t.to : t.from)) + '，' + dateLabel(t.ts) + '</div><div><span class="tk-k">' + (paid(t) ? '存進了' : '會存進') + '</span>' + esc(fundName(t.fund)) + '</div></div>' +
      (t.note ? '<p class="tk-q">「' + esc(t.note) + '」</p>' : '') +
      (t.appeal ? '<p class="tk-q" style="background:#FFF6DA"><span class="tk-k">申訴理由　</span>' + esc(t.appeal) + '</p>' : '') + mark +
      '</div><div class="tk-tear" aria-hidden="true"></div><div class="tk-stub">' + esc(stubLine(t)) + '</div></div>';
  }
  function sheetTicket() {
    var f = UI.form, t = S.tickets.filter(function (x) { return x.id === f.id; })[0];
    if (!t) return popWrap("罰單", '<div class="pop-box"><p class="note">這張罰單已經不在了。</p><button type="button" class="btn" data-act="close">關閉</button></div>');
    var me = S.me, op = other(me), id = esc(t.id);
    if (t.status === "appeal" && t.from === me) {
      return popWrap(nm(t.to) + "提出申訴",
        '<h2 class="pop-h">' + esc(nm(t.to)) + '提出申訴</h2>' +
        '<div style="position:relative">' + tkPaper(t, f, true) + '<div class="clipnote">' + I.clip + '<span>申訴理由</span><p>' + esc(t.appeal) + '</p></div></div>' +
        hideIf(f.mark, '<div class="acts"><button type="button" class="btn mint" style="min-height:56px;font-size:18px" data-act="t-judge" data-v="yes" data-id="' + id + '"' + busyAttr(true) + '>接受申訴，這次免罰</button>' +
          '<button type="button" class="btn" data-act="t-judge" data-v="no" data-id="' + id + '"' + busyAttr(true) + '>駁回，罰兩倍 ' + money(t.amount * 2) + '</button>' +
          '<p class="pop-note">由開單的人裁決。不確定的話，先跟對方聊聊也可以。</p></div><button type="button" class="pop-close" data-act="close">先不決定</button>'));
    }
    var acts = '';
    if (t.status === "pending" && t.to === me) {
      var c = catCount(me);
      acts = f.appealing
        ? '<div class="pop-box"><label class="lab" for="f-appeal">申訴理由<textarea id="f-appeal" class="field" rows="3" maxlength="200" data-bind="appeal" placeholder="例如：公車壞了，有照片為證">' + esc(f.appeal || "") + '</textarea></label>' +
          '<p class="note">由 ' + esc(nm(t.from)) + ' 裁決。被駁回要罰兩倍 ' + money(t.amount * 2) + '。</p>' +
          '<div class="grid2"><button type="button" class="btn flat" data-act="t-appeal-cancel">取消</button><button type="button" class="btn mint" data-act="t-appeal" data-id="' + id + '"' + busyAttr((f.appeal || "").trim()) + '>送出申訴</button></div></div>'
        : '<div class="acts"><button type="button" class="act red" data-act="t-pay" data-id="' + id + '"' + busyAttr(true) + '>' + I.check + '<span><b>認罰 ' + money(t.amount) + '</b><small>馬上存進' + esc(fundName(t.fund)) + '</small></span></button>' +
          '<button type="button" class="act gold" data-act="t-card" data-id="' + id + '"' + busyAttr(t.ruleId && c > 0) + '>' + qq("", "") + '<span><b>用賴貓卡免罰</b><small>' + (!t.ruleId ? '臨時罰單不能用賴貓卡' : c ? '你還有 ' + c + ' 張' : '你目前沒有賴貓卡，要靠' + esc(nm(op)) + '送') + '</small></span></button>' +
          '<button type="button" class="act" data-act="t-appeal-open">' + I.scale + '<span><b>我要申訴</b><small>' + esc(nm(t.from)) + ' 會裁決，駁回要罰兩倍 ' + money(t.amount * 2) + '</small></span></button></div>';
      acts += '<button type="button" class="pop-close" data-act="close">先不處理</button>';
    } else if (paid(t) && t.voidBy === me) {
      acts = '<div class="pop-box"><p class="note">你已申請刪除這張罰單，等 ' + esc(nm(op)) + ' 同意。同意後 ' + money(t.final) + ' 會從基金扣除。</p>' +
        '<button type="button" class="btn" data-act="void-no" data-id="' + id + '"' + busyAttr(true) + '>撤回申請</button></div>' + POP_CLOSE;
    } else if (paid(t) && t.voidBy) {
      acts = '<div class="pop-box"><p class="note">' + esc(nm(t.voidBy)) + ' 申請刪除這張罰單。同意後 ' + money(t.final) + ' 會從基金扣除。</p>' +
        '<div class="grid2"><button type="button" class="btn" data-act="void-no" data-id="' + id + '"' + busyAttr(true) + '>不同意</button><button type="button" class="btn primary" style="font-size:16px" data-act="void-yes" data-id="' + id + '"' + busyAttr(true) + '>同意刪除</button></div></div>' + POP_CLOSE;
    } else if (paid(t) && t.self && t.to !== me) {
      acts = (f.confirmVeto
        ? '<div class="pop-box"><p class="note">否決後這次自首不算數，' + money(t.final) + ' 會從基金扣除，不用 ' + esc(nm(t.to)) + ' 同意。</p><div class="grid2"><button type="button" class="btn flat" data-act="veto-cancel">取消</button><button type="button" class="btn primary" style="font-size:16px" data-act="veto-yes" data-id="' + id + '"' + busyAttr(true) + '>確定否決</button></div></div>'
        : '<div class="pop-box"><p class="note">覺得不用罰？可以直接否決，錢會退出基金。</p><button type="button" class="btn danger" data-act="veto-confirm">否決這次自首</button></div>') + POP_CLOSE;
    } else if (paid(t)) {
      acts = (f.confirmVoid
        ? '<div class="pop-box"><p class="note">送出後要 ' + esc(nm(op)) + ' 同意才會刪除，金額會從基金扣除。</p><div class="grid2"><button type="button" class="btn flat" data-act="void-cancel">取消</button><button type="button" class="btn primary" style="font-size:16px" data-act="void-ask" data-id="' + id + '"' + busyAttr(true) + '>確定申請刪除</button></div></div>'
        : '<button type="button" class="pop-close" style="opacity:.85" data-act="void-confirm">申請刪除這張罰單</button>') + POP_CLOSE;
    } else acts = POP_CLOSE;
    return popWrap(t.status === "pending" && t.to === me ? nm(t.from) + "開給你的罰單" : "罰單", tkPaper(t, f) + hideIf(f.mark, acts));
  }

  /* 法規提案（新規則、修改、刪除），由對方表決 */
  function sheetVote() {
    var f = UI.form, r = S.rules.filter(function (x) { return x.id === f.id; })[0];
    if (!r || (r.status === "active" && !r.change && !f.mark)) return popWrap("法規提案", '<div class="pop-box"><p class="note">這條提案已經處理好了。</p><button type="button" class="btn" data-act="close">關閉</button></div>');
    var isNew = r.status === "pending", del = r.change === "delete", by = isNew ? r.by : r.changeBy, id = esc(r.id);
    var title = isNew ? "法規提案" : del ? "刪除提案" : "修改提案";
    var rows = '<div class="k">提案人</div><div class="v">' + esc(nm(by)) + '</div>' +
      (isNew ? '<div class="k">規則</div><div class="v big">' + esc(r.title) + '</div><div class="k">每次罰</div><div class="v amt">' + money(r.amount) + '</div><div class="k">日期</div><div class="v">' + dateLabel(r.createdAt) + '</div>'
        : del ? '<div class="k">規則</div><div class="v big">' + esc(r.title) + '</div><div class="k">現在罰</div><div class="v amt">' + money(r.amount) + '</div><div class="k">提案</div><div class="v">刪除這條規則（以前的罰單會保留）</div>'
        : '<div class="k">原本</div><div class="v"><s>' + esc(r.title) + ' ' + money(r.amount) + '</s></div><div class="k">改成</div><div class="v big">' + esc(r.newTitle) + '</div><div class="k">每次罰</div><div class="v amt">' + money(r.newAmount) + '</div>');
    var paper = '<div class="paper prop"><div class="p-head"><span class="p-court">' + CAT + '賴貓法庭</span><span class="num">No.' + esc(String(r.id).toUpperCase().slice(0, 6)) + '</span></div>' +
      '<h2>' + title + '</h2><div class="p-grid">' + rows + '</div>' + (f.mark ? '<span class="mark red" role="status">通過</span>' : '') + '</div>';
    var acts = by === S.me ? '<p class="pop-note">等' + esc(nm(other(S.me))) + '表決。</p>' + POP_CLOSE
      : '<div class="acts"><div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px">' +
        '<button type="button" class="btn" data-act="' + (isNew ? 'rule-no' : 'change-no') + '" data-id="' + id + '"' + busyAttr(true) + '>先不要</button>' +
        '<button type="button" class="btn primary" data-act="' + (isNew ? 'vote-yes' : 'vote-change-yes') + '" data-id="' + id + '"' + busyAttr(true) + '>同意，生效</button></div>' +
        '<p class="pop-note">' + (isNew ? '同意之後兩個人都要遵守。先不要的話，這條提案會退回給' + esc(nm(by)) + '。' : '同意之前，舊規則照樣有效。') + '</p></div>' +
        '<button type="button" class="pop-close" data-act="close">先不決定</button>';
    return popWrap(title, '<div class="paper-wrap">' + paper + '</div>' + hideIf(f.mark, acts));
  }

  function sheetRule() {
    var f = UI.form, r = f.ruleId ? S.rules.filter(function (x) { return x.id === f.ruleId; })[0] : null;
    var mode = !r ? "new" : r.status === "pending" ? "pending" : "active";
    var locked = mode === "active" && r.change;
    var op = esc(nm(other(S.me)));
    var title = mode === "new" ? "提議新規則" : mode === "pending" ? "修改提議" : "修改或刪除規則";
    var foot = mode === "new" ? '<p class="note">送出後要 ' + op + ' 同意才會生效。</p>' +
        '<button type="button" class="btn primary" data-act="submit-rule"' + busyAttr((f.rtitle || "").trim()) + '>送出提議</button>'
      : mode === "pending" ? '<p class="note">這條提議還沒生效，可以直接修改。</p>' +
        '<button type="button" class="btn primary" data-act="submit-rule"' + busyAttr((f.rtitle || "").trim()) + '>儲存修改</button>' +
        (r.by === S.me ? '<button type="button" class="btn flat danger" data-act="rule-no" data-id="' + esc(r.id) + '"' + busyAttr(true) + '>撤回提議</button>' : '')
      : locked ? '<p class="note">這條規則已經有一個變更在等待同意，處理完才可以再改。</p>'
      : '<p class="note">修改或刪除都要 ' + op + ' 同意，同意前會沿用舊規則。</p>' +
        '<button type="button" class="btn primary" data-act="submit-rule"' + busyAttr((f.rtitle || "").trim()) + '>送出修改申請</button>' +
        (f.confirmDel
          ? '<div class="grid2"><button type="button" class="btn flat" data-act="del-cancel">取消</button><button type="button" class="btn danger" data-act="del-rule"' + busyAttr(true) + '>確定申請刪除</button></div>'
          : '<button type="button" class="btn flat danger" data-act="del-ask">申請刪除這條規則</button>');
    if (locked) return sheetWrap(title, '<div class="box"><span class="li-t">' + esc(r.title) + '</span><span class="n" style="font-weight:700;font-size:20px">' + money(r.amount) + '</span></div>' + foot);
    return sheetWrap(title,
      '<label class="lab">規則內容<input id="r-title" class="field" maxlength="40" data-bind="rtitle" value="' + esc(f.rtitle || "") + '" placeholder="例如：吵架後先冷靜十分鐘"></label>' +
      amountBox("r-amount", "ramt", f.ramt == null ? 20 : f.ramt, "r-amt") + foot);
  }

  function rewardReady(f) { return (f.reason || "").trim() && (f.kind === "cat" || (f.ctitle || "").trim()); }
  function rewardPreview(f) {
    return f.kind === "cat"
      ? { kind: "cat", title: "賴貓卡", desc: "免除一張罰單", color: "gold", from: S.me, reason: f.reason || "" }

        sb.rpc("get_state").then(function (r) {
          var bad = rpcResult(r);
          if (bad) { UI.busy = false; if (bad.code === "auth") { logout(bad.error); return; } UI.pair.error = bad.error; render(); return; }
          if (r.data && r.data.paired) { UI.busy = false; applyState(r.data); render(); toast("對方已經加入了"); return; }
          pairCall("leave_couple");
        });
        break;
      case "copy-code":
        try { navigator.clipboard.writeText(S.invite).then(function () { toast("已複製"); }); } catch (err) { toast(S.invite); }
        break;
      case "tab": UI.sheet = null; UI.form = {}; goTab(el.getAttribute("data-tab")); break;
      case "hist": UI.hist = v; render(); break;
      case "style": S.style = normStyle(el.getAttribute("data-style")); lsSet(STYLE_KEY, S.style); render(); break;
      case "look-mode": S.mode = v; lsSet(MODE_KEY, S.mode); render(); break;
      case "sheet": openSheet(el.getAttribute("data-sheet")); break;
      case "close": case "close-bg": closeSheet(); break;
      case "open-ticket": openSheet("ticket", { id: id, appeal: "", appealing: false }); break;
      case "vote-open": openSheet("vote", { id: id }); break;
      case "f-mode": f.mode = v; renderLayer(); break;
      case "f-fund": f.fund = v; renderLayer(); break;
      case "f-rule":
        if (id === "__temp__") { f.ruleId = id; if (!f.amount) f.amount = 50; renderLayer(); break; }
        var r = S.rules.filter(function (x) { return x.id === id; })[0]; f.ruleId = id; f.amount = r ? r.amount : 0; renderLayer(); break;
      case "f-amt": f.amount = Math.max(0, (Number(f.amount) || 0) + Number(v)); setAmt("f-amount", f.amount); break;
      case "r-amt": f.ramt = Math.max(0, (f.ramt == null ? 20 : Number(f.ramt) || 0) + Number(v)); setAmt("r-amount", f.ramt); break;
      case "submit-ticket":
        var isTemp = f.ruleId === "__temp__";
        send("createTicket", { temp: isTemp, title: f.ttitle, ruleId: isTemp ? "" : f.ruleId, mode: f.mode, amount: f.amount, note: f.note, fund: f.fund, confirm: isTemp || !!f.confirm },
          f.mode === "self" ? "已自首，" + money(f.amount) + " 存入基金" : (isTemp || f.confirm ? "罰單已送出，等" + opn + "回應" : "罰單已入帳"));
        break;
      case "t-pay": sendStamp("payTicket", { id: id }, ["已入帳", "ok"], "已認罰，存入基金"); break;
      case "t-card": sendStamp("catTicket", { id: id }, ["賴貓卡免罰", "gold"], "賴貓卡出動，這張罰單免除了"); break;
      case "t-appeal-open": f.appealing = true; renderLayer(); var ta = document.getElementById("f-appeal"); if (ta) ta.focus(); break;
      case "t-appeal-cancel": f.appealing = false; renderLayer(); break;
      case "t-appeal": send("appealTicket", { id: id, reason: f.appeal }, "申訴已送出，等對方裁決"); break;
      case "void-confirm": f.confirmVoid = true; renderLayer(); break;
      case "void-cancel": f.confirmVoid = false; renderLayer(); break;
      case "veto-confirm": f.confirmVeto = true; renderLayer(); break;
      case "veto-cancel": f.confirmVeto = false; renderLayer(); break;
      case "veto-yes": send("vetoSelf", { id: id }, "已否決這次自首"); break;
      case "void-ask": send("requestVoid", { id: id }, "刪除申請已送出，等" + opn + "同意"); break;
      case "void-yes": send("answerVoid", { id: id, accept: true }, "罰單已刪除"); break;
      case "void-no": send("answerVoid", { id: id, accept: false }, "已取消刪除申請"); break;
      case "t-judge":
        var jt = findT(id), yes = v === "yes";
        sendStamp("judgeAppeal", { id: id, accept: yes }, yes ? ["申訴成功", "ok"] : ["駁回 " + money((jt ? jt.amount : 0) * 2), "bad"], yes ? "已接受申訴，這張免罰" : "已駁回申訴，罰雙倍");
        break;
      case "submit-rule":
        var amtR = f.ramt == null ? 20 : f.ramt;
        var cur = f.ruleId ? S.rules.filter(function (x) { return x.id === f.ruleId; })[0] : null;
        if (!cur) send("proposeRule", { title: f.rtitle, amount: amtR }, "提議已送出，等" + opn + "同意");
        else if (cur.status === "pending") send("editPending", { id: cur.id, title: f.rtitle, amount: amtR }, "提議已更新");
        else send("requestRuleChange", { id: cur.id, kind: "edit", title: f.rtitle, amount: amtR }, "修改申請已送出，等" + opn + "同意");
        break;
      case "rule-edit": openSheet("rule", { ruleId: id }); break;
      case "del-ask": f.confirmDel = true; renderLayer(); break;
      case "del-cancel": f.confirmDel = false; renderLayer(); break;
      case "del-rule": send("requestRuleChange", { id: f.ruleId, kind: "delete" }, "刪除申請已送出，等" + opn + "同意"); break;
      case "vote-change-yes": sendStamp("answerRuleChange", { id: id, accept: true }, ["通過", "red"], "已同意，規則已更新"); break;
      case "change-no": send("answerRuleChange", { id: id, accept: false }, "已取消這個變更"); break;
      case "vote-yes": sendStamp("agreeRule", { id: id }, ["通過", "red"], "規則已生效"); break;
      case "rule-no":
        var rr = S.rules.filter(function (x) { return x.id === id; })[0];
        send("removeRule", { id: id }, rr && rr.by === S.me ? "已撤回提議" : "已退回這個提議"); break;
      case "w-kind": f.kind = v; renderLayer(); break;
      case "w-color": f.color = v; renderLayer(); break;
      case "w-icon": f.icon = v; renderLayer(); break;
      case "submit-reward": send("giveCard", { kind: f.kind, title: f.ctitle, desc: f.cdesc, color: f.color, icon: f.icon, reason: f.reason }, "已把卡放進" + opn + "的卡包"); break;
      case "use-card": openSheet("use", { id: id }); break;
      case "confirm-use": send("useCard", { id: id }, "已使用，記得找" + opn + "兌現"); break;
      case "submit-settings":
        var u = UI.set || {};
        var ss = { nameA: u.nameA, nameB: u.nameB, start: u.start, weddingTarget: u.weddingTarget, travelTarget: u.travelTarget, weddingName: u.weddingName, travelName: u.travelName };
        send("saveSettings", ss, "已儲存", function () { setInit(); render(); }); break;
      case "q-preset": f.preset = v === "custom" ? null : Number(v); renderLayer(); if (v === "custom") { var qt = document.getElementById("q-title"); if (qt) qt.focus(); } break;
      case "submit-request":
        var pr = f.preset != null ? REQ_PRESETS[f.preset] : null;
        send("createRequest", { title: pr ? pr[0] : f.qtitle, icon: pr ? pr[1] : f.icon, note: f.qnote }, "申請書已送出，等" + opn + "回覆");
        break;
      case "req-open": openSheet("paper", { id: id }); break;
      case "paper-yes": stampPaper(id); break;
      case "paper-no-ask": f.confirmNo = true; renderLayer(); break;
      case "paper-no-cancel": f.confirmNo = false; renderLayer(); break;
      case "paper-no": send("answerRequest", { id: id, accept: false, reply: f.qreply }, "已婉拒，這份申請不會留在紀錄裡"); break;
      case "req-done": send("doneRequest", { id: id }, "已實現 ❤"); break;
      case "req-remove": send("removeRequest", { id: id }, "已收回"); break;
      case "logout": lsSet("meow-who", null); pushOff(true).then(function () { logout(""); }, function () { logout(""); }); break;
      case "push-toggle": e.preventDefault(); if (UI.push === "on") pushOff(false); else if (UI.push === "off") pushOn(); break;
      case "push-test": pushTest(); break;
      case "mem-open": openSheet("memview", { id: id }); break;
      case "mem-back": openSheet("memories"); break;
      case "mem-edit": openSheet("memory", { id: id }); break;
      case "mem-submit": submitMemory(); break;
      case "mem-nophoto": if (f.preview) URL.revokeObjectURL(f.preview); f.file = null; f.preview = ""; renderLayer(); break;
      case "mem-del-ask": f.confirmDel = true; renderLayer(); break;
      case "mem-del-cancel": f.confirmDel = false; renderLayer(); break;
      case "mem-del": deleteMemory(id); break;
    }
  });

  function setAmt(id, v) { var el = document.getElementById(id); if (el) el.value = v; }
  document.addEventListener("input", function (e) {
    var el = e.target, nk = el.getAttribute("data-bind-num");
    if (nk) { var n = Math.max(0, Math.min(100000, Number(el.value) || 0)); UI.form[nk] = Math.round(n * 100) / 100; return; }
    var lk = el.getAttribute("data-bind-login");
    if (lk) { UI.login[lk] = el.value; return; }
    var pk = el.getAttribute("data-bind-pair");
    if (pk) { UI.pair[pk] = el.value; return; }
    var sk = el.getAttribute("data-bind-set");
    if (sk) { if (UI.set) UI.set[sk] = el.value; return; }
    var k = el.getAttribute("data-bind");
    if (!k) return;
    UI.form[k] = el.value;
    if (k === "ttitle") { var tb = document.querySelector('[data-act="submit-ticket"]'); if (tb) tb.disabled = UI.busy || !ticketReady(UI.form); }
    var need = { appeal: "t-appeal", rtitle: "submit-rule" }[k];
    if (need) { var b = document.querySelector('[data-act="' + need + '"]'); if (b) b.disabled = UI.busy || !el.value.trim(); }
    if (UI.sheet === "memory") { var mb = document.querySelector('[data-act="mem-submit"]'); if (mb) mb.disabled = UI.busy || !memReady(UI.form); }
    if (UI.sheet === "request") { var qb = document.querySelector('[data-act="submit-request"]'); if (qb) qb.disabled = UI.busy || !reqReady(UI.form); }
    if (UI.sheet === "reward") {
      var btn = document.querySelector('[data-act="submit-reward"]');
      if (btn) btn.disabled = UI.busy || !rewardReady(UI.form);
      var pv = document.getElementById("card-preview");
      if (pv) pv.innerHTML = cardHTML(rewardPreview(UI.form), '', true);
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "m-file" && UI.sheet === "memory") {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      if (!/^image\//.test(file.type || "image/")) { toast("請選擇一張相片"); return; }
      if (UI.form.preview) URL.revokeObjectURL(UI.form.preview);
      UI.form.file = file; UI.form.preview = URL.createObjectURL(file); renderLayer();
      return;
    }
    var k = e.target.getAttribute("data-bind-check");
    if (k) UI.form[k] = e.target.checked;
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && UI.sheet && !(UI.form && (UI.form.stamping || UI.form.mark))) closeSheet(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
  setInterval(refresh, 30000);

  var yrPending = 0;
  function tabFromHash() {
    var h = (location.hash || "").replace("#", "");
    var rv = /^review(?:-(\d{4}))?$/.exec(h);
    if (rv) { yrPending = rv[1] ? +rv[1] : (yrSeason() || +todayHK().slice(0, 4)); return true; }
    h = { tickets: "inbox", me: "home" }[h] || h;
    if (VIEWS[h]) { UI.tab = h; UI.sheet = null; UI.set = null; return true; }
    return false;
  }
  tabFromHash();
  window.addEventListener("hashchange", function () { if (tabFromHash()) { render(); window.scrollTo(0, 0); } });

  render();
  sb.auth.getSession().then(function (r) {
    auth = r.data && r.data.session || null; booting = false;
    render(); if (auth) refresh();
  });
  sb.auth.onAuthStateChange(function (ev, session) {
    if (ev === "SIGNED_OUT") { if (auth) { auth = null; S.loaded = false; render(); } }
    else if (session) auth = session;
  });
})();

</script>
</body>
</html>
