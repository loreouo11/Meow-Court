<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>賴貓法庭・舊版已停用</title>
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FBEFF3; color: #3B2A33; font-family: "PingFang TC", "Noto Sans TC", sans-serif; }
main { max-width: 340px; padding: 24px; text-align: center; }
img { width: 140px; height: auto; }
h1 { margin: 8px 0 0; font-size: 24px; }
p { font-size: 15px; line-height: 1.6; color: #7A5F6B; }
a { display: inline-block; margin-top: 8px; padding: 12px 22px; border-radius: 999px; background: #E8546E; color: #fff; text-decoration: none; border: 2.5px solid #3B2A33; box-shadow: 3px 3px 0 #3B2A33; }
</style>
</head>
<body>
<main>
  <img src="../qiqi.svg" alt="">
  <h1>舊版已經停用</h1>
  <p>舊版（Google 試算表）的資料都已經搬到新版。<br>舊資料仍然留在原本的 Google 試算表裡。</p>
  <a href="../">前往賴貓法庭</a>
</main>
<script>
if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
  navigator.serviceWorker.getRegistrations().then(function (rs) {
    rs.forEach(function (r) { if (/\/legacy\/$/.test(r.scope)) r.unregister(); });
  }).catch(function () {});
}
</script>
</body>
</html>
